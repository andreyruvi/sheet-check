<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sheet Check">
  <title>Sheet Check</title>
  <rect width="64" height="64" rx="10" fill="#f2efe9"/>
  <!-- A small stack of sheets -->
  <rect x="13" y="9" width="34" height="44" rx="2" fill="#ded9cf" stroke="#8d8577" stroke-width="1"/>
  <rect x="16" y="12" width="34" height="44" rx="2" fill="#fffefb" stroke="#2c3038" stroke-width="1.6"/>
  <!-- Register rows -->
  <g stroke="#9c968a" stroke-width="1.6" stroke-linecap="round">
    <path d="M21 22h14M21 28h20M21 34h17M21 40h11"/>
  </g>
  <!-- Title block -->
  <rect x="35.5" y="44.5" width="11" height="8" fill="none" stroke="#9c968a" stroke-width="1.2"/>
  <!-- The check -->
  <path d="M34 36l6 7 12-17" fill="none" stroke="#2f6b46" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
